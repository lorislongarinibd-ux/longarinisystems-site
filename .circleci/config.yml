version: 2.1

jobs:
  ddf-synthesis:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    parallelism: 30
    steps:
      - checkout
      - run:
          name: Install Yosys
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq yosys
      - run:
          name: Saturate both vCPUs with two deterministic shards
          command: |
            set -euo pipefail
            cd ddf_public_executor
            base=$(( CIRCLE_NODE_INDEX * 2 ))
            python3 tools/run_shard.py --worker "$base" --workers 60 --count 4096 > "circle_${base}.log" 2>&1 &
            p1=$!
            worker2=$(( base + 1 ))
            python3 tools/run_shard.py --worker "$worker2" --workers 60 --count 4096 > "circle_${worker2}.log" 2>&1 &
            p2=$!
            rc=0
            wait "$p1" || rc=1
            wait "$p2" || rc=1
            cat circle_*.log
            exit "$rc"
      - store_artifacts:
          path: ddf_public_executor/out

workflows:
  ddf-free-fabric:
    jobs:
      - ddf-synthesis:
          filters:
            branches:
              only: ddf-free-fabric-v2

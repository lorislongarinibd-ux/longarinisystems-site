version: 2.1

jobs:
  ddf-synthesis:
    docker:
      - image: cimg/base:stable
    resource_class: large
    parallelism: 30
    steps:
      - checkout
      - run:
          name: Install Yosys
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq yosys
      - run:
          name: Saturate four vCPUs with deterministic shards
          command: |
            set -euo pipefail
            cd ddf_public_executor
            base=$(( CIRCLE_NODE_INDEX * 4 ))
            pids=""
            for off in 0 1 2 3; do
              worker=$(( base + off ))
              python3 tools/run_shard.py --worker "$worker" --workers 120 --count 4096 > "circle_${worker}.log" 2>&1 &
              pids="$pids $!"
            done
            rc=0
            for p in $pids; do
              wait "$p" || rc=1
            done
            cat circle_*.log
            exit "$rc"
      - store_artifacts:
          path: ddf_public_executor/out

workflows:
  ddf-free-fabric:
    jobs:
      - ddf-synthesis:
          filters:
            branches:
              only: ddf-free-fabric-v2
